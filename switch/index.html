<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>赞美诗分享页面</title>
    <style>
        :root {
            --bg-card: white;
            --text-primary: #333;
            --text-secondary: #555;
            --text-muted: #666;
            --border-color: #e0e0e0;
            --info-bg: #f0f0f0;
            --accent-color: #667eea;
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #2563eb 100%);
            --highlight-bg: #fff8e1;
            --highlight-border: #ffe082;
            --highlight-text: #8a6d00;
            --notice-bg: #fff1e6;
            --notice-border: #ffb877;
            --notice-text: #9a4a00;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-card: #2a2a2a;
                --text-primary: #fff;
                --text-secondary: #ccc;
                --text-muted: #999;
                --border-color: #4a4a4a;
                --info-bg: #3a3a3a;
                --accent-color: #667eea;
                --accent-gradient: linear-gradient(135deg, #4facfe 0%, #2563eb 100%);
                --highlight-bg: #3a3320;
                --highlight-border: #5c4e1a;
                --highlight-text: #ffd54f;
                --notice-bg: #3a2818;
                --notice-border: #6b4321;
                --notice-text: #ffab66;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--accent-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 24px;
            font-size: 24px;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .site-link {
            color: var(--accent-color);
            font-weight: 600;
            word-break: break-all;
            text-decoration: underline;
        }

        .site-link:active {
            opacity: 0.7;
        }

        .highlight {
            background: var(--highlight-bg);
            border: 1px solid var(--highlight-border);
            color: var(--highlight-text);
            border-radius: 6px;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.8;
        }

        .wechat {
            font-weight: 700;
        }

        .notice {
            background: var(--notice-bg);
            border: 1px solid var(--notice-border);
            color: var(--notice-text);
            border-radius: 6px;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.8;
            margin-top: 14px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
            }

            h1 {
                font-size: 20px;
            }

            p, .highlight, .notice {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>赞美诗分享页面</h1>
        <p>

            <a class="site-link" href="https://zms-ydl.jdbendi.com" target="_blank" rel="noopener noreferrer">zms-ydl.jdbendi.com</a>
            这个网站，(也就是"赞美诗-要登录.建德本地.com"缩写),这个网站需要登录，需支付30元购买帐号密码登录点播赞美诗。
        </p>
        <p>
            支付和索要帐号密码的方式是加站长微信：<span class="wechat">trust030703</span>
        </p>
        <div class="highlight">
            真心希望你能够支持一下站长，站长要生活，要开支的，30元真的不多吧！
        </div>
        <div class="notice">
            本页面会不定期地在此广告页面和赞美诗分享页面之间切换。如您需稳定地点播赞美诗,请购买帐号密码使用!
        </div>
    </div>
</body>
</html>
